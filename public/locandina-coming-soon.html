<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080"/>
<title>SimUniverse — Coming Soon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Barlow+Condensed:wght@700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #05050d;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse 80% 70% at 60% 30%, #0b1a3d 0%, #05050d 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* ── STARS ── */
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 8%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 28% 22%, rgba(255,255,255,.7) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 5%, #fff 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 14%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 9%, rgba(255,255,255,.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 6% 40%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 92% 35%, rgba(255,255,255,.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 78%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 18% 88%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 82% 82%, rgba(255,255,255,.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 38% 95%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 92%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 4% 65%, rgba(255,255,255,.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 96% 60%, rgba(255,255,255,.4) 0%, transparent 100%),
      radial-gradient(2px 2px at 50% 50%, rgba(46,125,255,.15) 0%, transparent 100%);
  }

  /* ── PLANET ── */
  .planet-wrap {
    position: absolute;
    top: -140px;
    right: -100px;
    width: 560px;
    height: 560px;
  }

  .planet {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #1a6fff 0%, #0d3fa8 50%, #071d5c 100%);
    box-shadow:
      inset -30px -20px 80px rgba(0,0,0,.6),
      inset 20px 15px 60px rgba(90,174,255,.18),
      0 0 120px rgba(46,125,255,.15),
      0 0 60px rgba(0,224,255,.08);
    overflow: hidden;
    position: relative;
  }

  .planet::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      repeating-linear-gradient(
        -28deg,
        transparent 0px,
        transparent 38px,
        rgba(10,40,120,.25) 38px,
        rgba(10,40,120,.25) 41px
      );
  }

  .planet::after {
    content: '';
    position: absolute;
    top: 8%; left: 12%;
    width: 40%; height: 30%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(90,174,255,.28) 0%, transparent 70%);
  }

  /* ── RING ── */
  .ring-wrap {
    position: absolute;
    top: 140px;
    right: -200px;
    width: 760px;
    height: 200px;
  }

  .ring-wrap svg {
    width: 100%;
    height: 100%;
  }

  /* ── GLOW BEAM ── */
  .glow-beam {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 55%;
    background: linear-gradient(
      to top,
      rgba(46,125,255,.04) 0%,
      transparent 100%
    );
    pointer-events: none;
  }

  /* ── TRACK LINE ── */
  .track-line {
    position: absolute;
    bottom: 160px;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, rgba(46,125,255,.35) 20%, rgba(0,224,255,.5) 50%, rgba(46,125,255,.35) 80%, transparent 100%);
    box-shadow: 0 0 18px rgba(0,224,255,.3);
  }

  /* ── CAR SILHOUETTE ── */
  .car-wrap {
    position: absolute;
    bottom: 112px;
    left: 50%;
    transform: translateX(-50%);
  }

  .car-wrap svg {
    filter: drop-shadow(0 0 18px rgba(0,224,255,.7)) drop-shadow(0 0 40px rgba(46,125,255,.4));
  }

  /* ── SPEED LINES ── */
  .speed-lines {
    position: absolute;
    bottom: 108px;
    left: 0;
    width: 38%;
    height: 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-left: 40px;
    opacity: .5;
  }
  .speed-lines span {
    display: block;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,224,255,.6));
  }
  .speed-lines span:nth-child(1) { width: 60%; }
  .speed-lines span:nth-child(2) { width: 85%; }
  .speed-lines span:nth-child(3) { width: 45%; }

  .speed-lines-r {
    left: auto;
    right: 0;
    padding-left: 0;
    padding-right: 40px;
    transform: scaleX(-1);
  }

  /* ── CONTENT ── */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: -60px;
  }

  .eyebrow {
    font-family: 'Barlow Condensed', 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #00e0ff;
    margin-bottom: 28px;
    opacity: .9;
  }

  .logo-text {
    font-family: 'Barlow Condensed', 'Inter', sans-serif;
    font-size: 112px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.01em;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 0;
  }

  .logo-text .accent {
    background: linear-gradient(90deg, #2e7dff, #00e0ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline-big {
    font-family: 'Barlow Condensed', 'Inter', sans-serif;
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 8px;
    background: linear-gradient(90deg, #ff9a00 10%, #ffd166 50%, #ff6b00 90%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 24px rgba(255,154,0,.5));
  }

  .divider {
    width: 120px;
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(90deg, #2e7dff, #00e0ff);
    margin: 36px auto;
    box-shadow: 0 0 16px rgba(0,224,255,.5);
  }

  .desc {
    font-size: 26px;
    font-weight: 400;
    color: rgba(255,255,255,.72);
    letter-spacing: 0.01em;
    line-height: 1.5;
    max-width: 680px;
  }

  .desc strong {
    color: rgba(255,255,255,.95);
    font-weight: 700;
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 90px;
    background: linear-gradient(180deg, transparent, rgba(5,5,13,.8));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    z-index: 10;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 100px;
    padding: 10px 24px;
    font-size: 18px;
    font-weight: 700;
    color: rgba(255,255,255,.8);
    letter-spacing: 0.02em;
  }

  .pill-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00e0ff;
    box-shadow: 0 0 8px #00e0ff;
  }

  /* ── CORNER DECORATIONS ── */
  .corner {
    position: absolute;
    width: 56px; height: 56px;
    z-index: 5;
    opacity: .5;
  }
  .corner-tl { top: 32px; left: 32px; border-top: 2px solid #2e7dff; border-left: 2px solid #2e7dff; }
  .corner-tr { top: 32px; right: 32px; border-top: 2px solid #2e7dff; border-right: 2px solid #2e7dff; }
  .corner-bl { bottom: 32px; left: 32px; border-bottom: 2px solid #2e7dff; border-left: 2px solid #2e7dff; }
  .corner-br { bottom: 32px; right: 32px; border-bottom: 2px solid #2e7dff; border-right: 2px solid #2e7dff; }
</style>
</head>
<body>
<div class="card">
  <div class="stars"></div>

  <!-- Angoli decorativi -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Pianeta + anello -->
  <div class="planet-wrap">
    <div class="planet"></div>
  </div>

  <div class="ring-wrap">
    <svg viewBox="0 0 760 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="rg" x1="0" y1="100" x2="760" y2="100" gradientUnits="userSpaceOnUse">
          <stop stop-color="#ff6b00" stop-opacity="0.1"/>
          <stop offset="0.3" stop-color="#ff9a00"/>
          <stop offset="0.5" stop-color="#ffd166"/>
          <stop offset="0.7" stop-color="#ff9a00"/>
          <stop offset="1" stop-color="#ff6b00" stop-opacity="0.1"/>
        </linearGradient>
        <filter id="rf">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <ellipse cx="490" cy="100" rx="280" ry="88" stroke="url(#rg)" stroke-width="5" fill="none" filter="url(#rf)"/>
    </svg>
  </div>

  <!-- Fascio luce a terra -->
  <div class="glow-beam"></div>

  <!-- Linea pista -->
  <div class="track-line"></div>

  <!-- Speed lines sx -->
  <div class="speed-lines">
    <span></span><span></span><span></span>
  </div>

  <!-- Speed lines dx -->
  <div class="speed-lines speed-lines-r">
    <span></span><span></span><span></span>
  </div>

  <!-- Macchina da corsa -->
  <div class="car-wrap">
    <svg width="320" height="80" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cg" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
          <stop stop-color="#2e7dff"/>
          <stop offset="0.5" stop-color="#00e0ff"/>
          <stop offset="1" stop-color="#2e7dff"/>
        </linearGradient>
      </defs>
      <!-- Corpo principale -->
      <path d="M40 44 Q48 28 90 26 L210 24 Q260 24 276 36 L296 44 Q304 48 296 52 L40 52 Q28 52 28 46 Z" fill="url(#cg)" opacity=".95"/>
      <!-- Cockpit -->
      <path d="M110 26 Q130 10 180 10 Q210 10 220 26 Z" fill="#00e0ff" opacity=".85"/>
      <!-- Alettone anteriore -->
      <path d="M270 44 L310 44 L314 52 L268 52 Z" fill="url(#cg)" opacity=".9"/>
      <rect x="280" y="38" width="36" height="6" rx="2" fill="#00e0ff" opacity=".7"/>
      <!-- Alettone posteriore -->
      <rect x="28" y="38" width="28" height="5" rx="2" fill="#00e0ff" opacity=".7"/>
      <rect x="20" y="32" width="44" height="4" rx="2" fill="url(#cg)" opacity=".6"/>
      <!-- Ruote -->
      <circle cx="82" cy="54" r="18" fill="#050510" stroke="url(#cg)" stroke-width="4"/>
      <circle cx="82" cy="54" r="8" fill="#0a0a20" stroke="#00e0ff" stroke-width="1.5" opacity=".6"/>
      <circle cx="240" cy="54" r="18" fill="#050510" stroke="url(#cg)" stroke-width="4"/>
      <circle cx="240" cy="54" r="8" fill="#0a0a20" stroke="#00e0ff" stroke-width="1.5" opacity=".6"/>
    </svg>
  </div>

  <!-- Contenuto testuale -->
  <div class="content">
    <div class="eyebrow">La community italiana del sim racing</div>
    <div class="logo-text">Sim<span class="accent">Universe</span></div>
    <div class="tagline-big">Coming Soon</div>
    <div class="divider"></div>
    <p class="desc">
      Tornei, team, assetti, guide.<br/>
      <strong>Tutto in un'unica piattaforma.</strong>
    </p>
  </div>

  <!-- Barra in basso -->
  <div class="bottom-bar">
    <div class="pill"><span class="pill-dot"></span> Tornei & Campionati</div>
    <div class="pill"><span class="pill-dot"></span> Team & Piloti</div>
    <div class="pill"><span class="pill-dot"></span> Assetti & Guide</div>
  </div>
</div>
</body>
</html>
